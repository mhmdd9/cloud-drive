x-dev-build: &dev-build
  image: cloude-drive:dev
  pull_policy: never
  build:
    context: .
    target: development

x-database-environment: &database-environment
  NEXT_TELEMETRY_DISABLED: "1"
  CHECKPOINT_DISABLE: "1"
  POSTGRES_USER: ${POSTGRES_USER:-clouddrive}
  POSTGRES_DB: ${POSTGRES_DB:-clouddrive}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

x-dev-environment: &dev-environment
  <<: *database-environment
  NODE_ENV: development
  AWS_EC2_METADATA_DISABLED: "true"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  S3_PROVIDER: minio
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-clouddrive}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_KMS_KEY_ID: arn:aws:kms:clouddrive-dev
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
  FILE_WORKER_CONCURRENCY: ${FILE_WORKER_CONCURRENCY:-2}

services:
  dev-web:
    <<: *dev-build
    restart: unless-stopped
    entrypoint: ["node", "docker/dev-entrypoint.mjs"]
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment: *dev-environment
    ports:
      - "127.0.0.1:${DEV_WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kms-key-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dev-worker:
    <<: *dev-build
    restart: unless-stopped
    entrypoint: ["node", "docker/dev-entrypoint.mjs"]
    command: ["npm", "run", "worker"]
    environment: *dev-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kms-key-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  kms-key-init:
    <<: *dev-build
    user: root
    restart: "no"
    command: ["node", "/app/docker/dev-key-init.mjs"]
    volumes:
      - kms_data:/kms

  storage-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    pull_policy: missing
    restart: "no"
    entrypoint: ["/bin/sh"]
    command: ["/scripts/storage-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clouddrive}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-clouddrive}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      S3_KMS_KEY_ID: arn:aws:kms:clouddrive-dev
    volumes:
      - ./docker/storage-init.sh:/scripts/storage-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
      kms-key-init:
        condition: service_completed_successfully

  migrate:
    <<: *dev-build
    restart: "no"
    entrypoint: ["node", "docker/dev-entrypoint.mjs"]
    command: ["npm", "run", "db:migrate"]
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *dev-build
    restart: "no"
    entrypoint: ["node", "docker/dev-entrypoint.mjs"]
    command: ["npm", "run", "db:seed"]
    environment:
      <<: *database-environment
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_NAME: ${ADMIN_NAME:?ADMIN_NAME is required}
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clouddrive}
      POSTGRES_DB: ${POSTGRES_DB:-clouddrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4
    pull_policy: missing
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clouddrive}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_KMS_SECRET_KEY_FILE: /kms/master.key
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${DEV_S3_PORT:-9000}:9000"
      - "127.0.0.1:${DEV_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
      - kms_data:/kms:ro
    depends_on:
      kms-key-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kms_data:
